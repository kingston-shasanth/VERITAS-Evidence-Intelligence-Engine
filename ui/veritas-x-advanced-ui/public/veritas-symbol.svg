<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="vxBgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="vxCyanGrad" x1="18" y1="43" x2="46" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="vxGlow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Precision Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#vxBgGrad)" filter="url(#vxGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Documentary Grounding Grid (Subtle evidence layers) -->
  <line x1="16" y1="16" x2="34" y2="16" stroke="#C7D2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.55" />
  <line x1="39" y1="16" x2="48" y2="16" stroke="#C7D2FE" stroke-width="2.2" stroke-linecap="round" opacity="0.35" />
  <line x1="16" y1="22" x2="26" y2="22" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Analytical Cross-Examination Vector (The X-Axis) -->
  <path
    d="M19 44 L45 22"
    stroke="url(#vxCyanGrad)"
    stroke-width="3.2"
