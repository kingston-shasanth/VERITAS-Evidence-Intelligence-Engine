  />

  <!-- Primary Verification Chevron (The V-Pillar) -->
  <path
    d="M17 28 L29.5 45 L47 18"
    stroke="#FFFFFF"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision Evidentiary Nexus Node -->
  <circle cx="32" cy="33.5" r="3.2" fill="#FFFFFF" />
  <circle cx="32" cy="33.5" r="1.6" fill="#0284C7" />
